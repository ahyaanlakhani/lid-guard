name: Windows build and recovery tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build without installing
        shell: powershell
        run: ./build.ps1 -NoInstall
      - name: Recovery regression tests
        shell: powershell
        run: ./tests/run.ps1
